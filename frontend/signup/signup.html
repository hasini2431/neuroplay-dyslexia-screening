<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NeuroPlay | Sign Up</title>

    <link rel="stylesheet" href="signup.css">
</head>

<body>

<div class="signup-page">

    <!-- LEFT SIDE -->
    <div class="signup-intro">

        <div class="brand">
            🧠
            <span>Neuro<span>Play</span></span>
        </div>

        <h1>
            Play.<br>
            Learn.<br>
            Discover.
        </h1>

        <p>
            Create your account and begin
            your gamified screening experience.
        </p>

        <div class="intro-icons">
            🎮 &nbsp; 🧠 &nbsp; ⭐
        </div>

    </div>


    <!-- RIGHT SIDE -->
    <div class="signup-card">

        <h2>Create Your Account</h2>

        <p class="subtitle">
            Let's get started with a few details.
        </p>


        <form id="signupForm">


            <!-- USERNAME -->
            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <!-- PASSWORD -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <!-- AGE -->
            <div class="form-group">

                <label for="age">
                    Age
                </label>

                <input
                    type="number"
                    id="age"
                    min="7"
                    max="17"
                    placeholder="7 - 17"
                    required
                >

            </div>


            <!-- GENDER -->
            <div class="form-group">

                <label for="gender">
                    Gender
                </label>

                <select id="gender" required>

                    <option value="">
                        Select gender
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Male">
                        Male
                    </option>

                </select>

            </div>


            <!-- NATIVE LANGUAGE -->
            <div class="form-group">

                <label for="nativelang">
                    Native Language
                </label>

                <select id="nativelang" required>

                    <option value="">
                        Select language
                    </option>

                    <option value="Telugu">
                        Telugu
                    </option>

                    <option value="Hindi">
                        Hindi
                    </option>

                    <option value="Tamil">
                        Tamil
                    </option>

                    <option value="Kannada">
                        Kannada
                    </option>

                    <option value="Malayalam">
                        Malayalam
                    </option>

                    <option value="Marathi">
                        Marathi
                    </option>

                    <option value="Bengali">
                        Bengali
                    </option>

                    <option value="English">
                        English
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <!-- OTHER LANGUAGE -->
            <div class="form-group">

                <label for="otherlang">
                    Do you know another language?
                </label>

                <select id="otherlang" required>

                    <option value="">
                        Select option
                    </option>

                    <option value="Yes">
                        Yes
                    </option>

                    <option value="No">
                        No
                    </option>

                </select>

            </div>


            <button
                type="submit"
                class="create-btn">

                Create Account →

            </button>


        </form>


        <p id="message"></p>


        <p class="login-text">

            Already have an account?

            <a href="../index.html">
                Login
            </a>

        </p>

    </div>

</div>


<script src="signup.js"></script>

</body>

</html>
