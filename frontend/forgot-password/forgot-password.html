<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NeuroPlay | Reset Password</title>

    <link rel="stylesheet" href="forgot-password.css">
</head>

<body>

    <div class="reset-container">

        <div class="reset-card">

            <div class="logo">
                🧠 NeuroPlay
            </div>

            <h1>Reset Password 🔐</h1>

            <p class="subtitle">
                Create a new password for your account
            </p>

            <form id="resetForm">

                <div class="input-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter your new password"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your new password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="reset-btn">
                    Reset Password →
                </button>

            </form>


            <p id="message"></p>


            <div class="login-link">

                Remember your password?

                <a href="../login/login.html">
                    Login
                </a>

            </div>


            <div class="back-home">

                <a href="../index.html">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>


    <script src="forgot-password.js"></script>

</body>

</html>
